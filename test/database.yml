base: &base
  host: <%= ENV.fetch('DB_HOST', 'localhost') %>
<% if ENV['DB_PORT'] %>
  port: <%= ENV['DB_PORT'] %>
<% end %>
  username: <%= ENV.fetch('DB_USERNAME', 'tests') %>
  password: <%= ENV['DB_PASSWORD'] %>

mysql:
  adapter: mysql2
  database: geokit_rails_tests
  <<: *base

mysql2spatial:
  adapter: mysql2spatial
  database: geokit_rails_tests

postgresql:
  adapter: postgresql
  database: geokit_rails_tests
  <<: *base

sqlserver:
  adapter: sqlserver
  mode: ODBC
  dsn: geokit_rails_tests
  username: tests

sqlite:
  adapter: sqlite3
  database: test/test.sqlite3
