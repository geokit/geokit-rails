base: &base
  host: <%= ENV.fetch('DB_HOST', 'localhost') %>
  username: <%= ENV.fetch('DB_USERNAME', 'tests') %>
  password: <%= ENV.fetch('DB_PASSWORD', '') %>

mysql:
  adapter: mysql2
  database: <%= ENV.fetch('DB_NAME', 'geokit_rails_tests') %>
  <<: *base

mysql2spatial:
  adapter: mysql2spatial
  database: <%= ENV.fetch('DB_NAME', 'geokit_rails_tests') %>

postgresql:
  adapter: postgresql
  database: <%= ENV.fetch('DB_NAME', 'geokit_rails_tests') %>
  <<: *base

sqlserver:
  adapter: sqlserver
  mode: ODBC
  dsn: geokit_rails_tests
  username: tests

sqlite:
  adapter: sqlite3
  database: test/test.sqlite3

trilogy:
  adapter: trilogy
  database: <%= ENV.fetch('DB_NAME', 'geokit_rails_tests') %>
  <<: *base
